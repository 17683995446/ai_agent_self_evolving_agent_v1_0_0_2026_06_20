openapi: 3.0.3
info:
  title: 自驱永续进化Agent监控API
  description: |
    自驱Agent系统性能监控与状态查询接口。
    提供实时运行数据、历史趋势、健康检查等功能。
  version: 1.0.0
  contact:
    name: Self-Evolving Agent Team

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发服务器

paths:
  /:
    get:
      summary: 仪表盘页面
      description: 返回自驱Agent监控仪表盘HTML页面
      operationId: getDashboard
      responses:
        '200':
          description: 成功返回仪表盘页面
          content:
            text/html:
              schema:
                type: string

  /api/data:
    get:
      summary: 获取运行数据
      description: 返回Agent当前运行状态、指标和历史趋势
      operationId: getAgentData
      responses:
        '200':
          description: 成功返回Agent数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentData'
        '503':
          description: 数据存储未初始化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health:
    get:
      summary: 健康检查
      description: 检查仪表盘服务是否正常运行
      operationId: getHealth
      responses:
        '200':
          description: 服务正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  schemas:
    AgentData:
      type: object
      required:
        - cycles
        - recent_mae
        - success_rate
        - current_state
      properties:
        cycles:
          type: integer
          description: 已执行周期数
          example: 1250
        recent_mae:
          type: number
          format: float
          description: 近期平均绝对误差
          example: 0.0321
        success_rate:
          type: number
          format: float
          description: 近期任务成功率
          example: 0.85
        current_state:
          type: string
          enum: [IDLE, ACTIVE, REVIEW, EMERGENCY, MAINTENANCE, SHUTDOWN]
          description: 当前Agent状态
          example: ACTIVE
        reward:
          type: number
          format: float
          description: 当前周期综合奖励值
          example: 0.72
        memory_samples:
          type: integer
          description: 短期记忆样本数量
          example: 500
        task_pool:
          type: object
          description: 任务池统计信息
          properties:
            total_tasks:
              type: integer
              example: 12
        predictions:
          type: object
          description: 各层预测器输出
        errors:
          type: object
          description: 各维度预测误差
        history:
          type: array
          description: 历史数据趋势（最近100条）
          items:
            $ref: '#/components/schemas/HistoryEntry'

    HistoryEntry:
      type: object
      properties:
        cycle:
          type: integer
          example: 100
        mae:
          type: number
          format: float
          example: 0.05
        reward:
          type: number
          format: float
          example: 0.68
        duration:
          type: number
          format: float
          description: 周期执行耗时（秒）
          example: 0.023

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 错误描述
          example: Service Unavailable
